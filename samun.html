<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تۆماری صمون</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- هێنانی کتێبخانەی Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- هێنانی کتێبخانەی html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .dashboard-bg {
      background: linear-gradient(135deg, #d946ef 0%, #e11d48 25%, #f97316 45%, #0284c7 80%, #0f172a 100%);
    }
    .access-row {
      height: 23.3px !important;
      max-height: 23.3px !important;
    }
    .access-cell {
      padding-top: 1px !important;
      padding-bottom: 1px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
      line-height: 1.2 !important;
    }
    
    /* ڕێکخستنی پرێنت بۆ ئەوەی بە تەواوی پەڕەی A4 پڕ بکاتەوە و لە سەرەوە دەست پێبکات */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #reportModal, #reportModal * {
        visibility: visible !important;
      }
      #reportModal {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: white !important;
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }
      #printArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 5mm !important;
        box-shadow: none !important;
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="dashboard-bg min-h-screen p-4 md:p-8 select-none">

  <!-- Header Section -->
  <div class="max-w-5xl mx-auto flex justify-between items-center mb-4 no-print">
    <div class="flex items-center gap-3 bg-white/95 px-5 py-2 rounded-lg shadow-md border border-gray-200">
      <img src="logo.png" alt="لۆگۆی هوتێل" class="h-10 w-auto object-contain">
    </div>
    <a href="index.html" class="bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm px-4 py-2 rounded shadow-md border border-gray-600">
      گەڕانەوە بۆ سەرەکی
    </a>
  </div>

  <!-- Main Container -->
  <div class="max-w-5xl mx-auto no-print">
    
    <!-- Top Action Bar -->
    <div class="bg-white/95 backdrop-blur rounded-xl p-4 shadow-xl border border-gray-200 mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <h2 class="text-xl font-extrabold text-blue-900">تۆماری ڕۆژانەی صمون</h2>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <button onclick="openModal()" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 justify-center flex-1 md:flex-none">
          <span>+ تۆماری نوێ</span>
        </button>
        <button onclick="generateReport()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2 justify-center flex-1 md:flex-none">
          <span>🖨️ ڕاپۆرتی مانگانە</span>
        </button>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="bg-white/95 backdrop-blur rounded-xl p-4 shadow-xl border border-gray-200 mb-4 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2">
        <label class="text-xs font-bold text-gray-700">لە بەرواری:</label>
        <input type="date" id="startDate" onchange="filterByDate()" class="px-3 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-xs font-bold text-gray-700">تا بەرواری:</label>
        <input type="date" id="endDate" onchange="filterByDate()" class="px-3 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
    </div>

    <!-- Totals Summary Card -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div class="bg-blue-900 text-white p-3 rounded-xl shadow-lg flex justify-between items-center border border-blue-700">
        <span class="text-xs font-bold">کۆی گشتی عدد:</span>
        <span id="totalDana" class="text-lg font-black">0</span>
      </div>
      <div class="bg-green-800 text-white p-3 rounded-xl shadow-lg flex justify-between items-center border border-green-600">
        <span class="text-xs font-bold">کۆی گشتی حیساب:</span>
        <span id="totalHisab" class="text-lg font-black">0.000</span>
      </div>
    </div>

    <!-- Table Section -->
    <div class="bg-white/95 backdrop-blur rounded-xl p-4 shadow-2xl border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-blue-900 text-white text-xs access-row">
              <th class="access-cell border text-center">کردارەکان</th>
              <th class="access-cell border">بەروار</th>
              <th class="access-cell border">ڕۆژ</th>
              <th class="access-cell border">عدد</th>
              <th class="access-cell border">حیساب</th>
            </tr>
          </thead>
          <tbody id="samunTableBody" class="text-xs font-medium">
            <tr><td colspan="5" class="text-center p-2 text-gray-500">چاوەڕوانبن، داتا دەهێنرێت...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal Form -->
  <div id="samunModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 no-print">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-gray-200 relative">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 id="modalTitle" class="text-lg font-extrabold text-blue-900">تۆمارکردنی صمون</h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-red-600 font-bold text-lg">✕</button>
      </div>

      <form id="samunForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="recordId" value="">

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">بەروار:</label>
          <input type="date" id="samunDate" required onchange="updateDayName()"
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="bg-blue-50 p-2 rounded border border-blue-200 flex justify-between items-center">
          <span class="text-xs font-bold text-blue-800">ڕۆژ:</span>
          <span id="dayNameDisplay" class="text-sm font-extrabold text-blue-900">-</span>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">عدد:</label>
          <input type="number" id="samunDana" required oninput="calculateHisab()"
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                 placeholder="ژمارەی صمون بنووسە...">
        </div>

        <div class="bg-green-50 p-3 rounded border border-green-200">
          <div class="text-xs font-bold text-green-800 mb-1">حیساب:</div>
          <div id="hisabResult" class="text-lg font-black text-green-900">0.000</div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" id="submitBtn" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded shadow transition">
            تۆمارکردن
          </button>
          <button type="button" onclick="closeModal()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold px-3 py-2 rounded transition">
            داخستن
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Report (A4 Preview & Printable) -->
  <div id="reportModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-3xl w-full p-4 shadow-2xl relative my-4 max-h-[95vh] flex flex-col">
      
      <!-- Report Modal Controls -->
      <div class="flex justify-between items-center mb-3 pb-2 border-b flex-shrink-0 no-print">
        <h3 class="text-base font-bold text-gray-800">ڕاپۆرتی مانگانە</h3>
        <div class="flex gap-2">
          <button onclick="window.print()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow transition">پرێنت (Print)</button>
          <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded shadow transition">دابەزاندن بە PDF</button>
          <button onclick="closeReportModal()" class="bg-gray-500 hover:bg-gray-600 text-white text-xs font-bold px-3 py-1.5 rounded shadow transition">داخستن</button>
        </div>
      </div>

      <!-- Printable A4 Content Area -->
      <div class="overflow-y-auto flex-grow bg-gray-100 p-2 flex justify-center">
        <div id="printArea" class="bg-white p-5 text-black shadow" dir="rtl" style="width: 190mm;">
          
          <!-- Unified Header -->
          <div class="flex justify-between items-center border-b-2 border-black pb-2 mb-2">
            <div class="flex items-center">
              <img src="logo.png" alt="لۆگۆی هوتێل" class="h-10 w-auto object-contain">
            </div>
            <div class="text-center">
              <h1 class="text-sm font-black text-black"><span id="reportMonthTitle"></span></h1>
            </div>
            <div></div>
          </div>

          <!-- Table -->
          <table class="w-full text-right border-collapse border border-black mb-2 text-[11px]">
            <thead>
              <tr class="bg-gray-100 font-bold border-b border-black">
                <th class="p-1 border border-black text-center w-8">ژمارە</th>
                <th class="p-1 border border-black">بەروار</th>
                <th class="p-1 border border-black">ڕۆژ</th>
                <th class="p-1 border border-black text-center">عدد</th>
                <th class="p-1 border border-black text-center">حیساب</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
              <!-- Data Rows -->
            </tbody>
            <tfoot>
              <tr class="bg-gray-200 font-black border-t-2 border-black">
                <td colspan="3" class="p-1 border border-black text-left">کۆی گشتی:</td>
                <td id="reportTotalDana" class="p-1 border border-black text-center">0</td>
                <td id="reportTotalHisab" class="p-1 border border-black text-center">0.000</td>
              </tr>
            </tfoot>
          </table>

          <!-- Unified Footer / Signature -->
          <div class="flex justify-start mt-8 pt-4 pb-6 text-xs font-bold border-t border-gray-300">
            <div>بەڕێوەبەری گشتی هوتێل جیلا: <span id="managerNameDisplay" class="font-normal underline mr-2">چاوەڕوانبن...</span></div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jrdakonfokyayzlcqnef.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_wZlhj2VEgMjX4xy7M1OeBA_M5xLSNwG';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = '3-tbl-samun';
    let samunList = [];

    const monthTextMap = {
      1: 'مانگی یەک (01)',
      2: 'مانگی دوو (02)',
      3: 'مانگی سێ (03)',
      4: 'مانگی چوار (04)',
      5: 'مانگی پێنج (05)',
      6: 'مانگی شەش (06)',
      7: 'مانگی حەوت (07)',
      8: 'مانگی هەشت (08)',
      9: 'مانگی نۆ (09)',
      10: 'مانگی دە (10)',
      11: 'مانگی یازدە (11)',
      12: 'مانگی دوازدە (12)'
    };

    window.onload = function() {
      setDefaultDate();
      setMonthlyFilterDefault();
      fetchManagerName();
    };

    function setDefaultDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      
      document.getElementById('samunDate').value = `${year}-${month}-${day}`;
      updateDayName();
    }

    function setMonthlyFilterDefault() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      const firstDay = `${year}-${String(month + 1).padStart(2, '0')}-01`;
      const lastDayObj = new Date(year, month + 1, 0);
      const lastDay = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDayObj.getDate()).padStart(2, '0')}`;

      document.getElementById('startDate').value = firstDay;
      document.getElementById('endDate').value = lastDay;

      fetchSamunData(firstDay, lastDay);
    }

    function updateDayName() {
      const dateVal = document.getElementById('samunDate').value;
      if (!dateVal) return;

      const dateObj = new Date(dateVal + 'T00:00:00');
      const dayIndex = dateObj.getDay(); 
      
      const dayNamesMap = {
        0: 'یەکشەممە',
        1: 'دووشەممە',
        2: 'سێشەممە',
        3: 'چار شەممە',
        4: 'پێنجشەممە',
        5: 'جومعه',
        6: 'شەممە'
      };

      document.getElementById('dayNameDisplay').innerText = dayNamesMap[dayIndex];
    }

    function calculateHisab() {
      const dana = parseFloat(document.getElementById('samunDana').value) || 0;
      const nrxHazar = 8; 
      const result = dana / nrxHazar; 
      
      document.getElementById('hisabResult').innerText = result.toFixed(3);
      return result;
    }

    async function fetchSamunData(start, end) {
      // ڕیزکردن لە نوێوە بۆ کۆن (ascending: false) بۆ ئەوەی ئەمرۆ لە سەرەوە بێت
      let query = _supabase
        .from(TABLE_NAME)
        .select('*')
        .order('samun-date', { ascending: false });

      if (start && end) {
        query = query.gte('samun-date', start).lte('samun-date', end);
      }

      const { data, error } = await query;

      if (error) {
        console.error('هەڵە لە هێنانی صمون:', error.message);
        return;
      }

      samunList = data || [];
      renderTable();
      calculateTotals();
    }

    async function fetchManagerName() {
      const { data, error } = await _supabase
        .from('2_tbl_emp')
        .select('emp_manager')
        .limit(1);

      if (!error && data && data.length > 0) {
        const manager = data[0].emp_manager || 'نادیار';
        document.getElementById('managerNameDisplay').innerText = manager;
      } else {
        document.getElementById('managerNameDisplay').innerText = 'تۆمار نەکراوە';
      }
    }

    function filterByDate() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      if (startDate && endDate) {
        fetchSamunData(startDate, endDate);
      }
    }

    function calculateTotals() {
      let totalDana = 0;
      let totalHisab = 0;

      samunList.forEach(item => {
        totalDana += parseFloat(item['samun-dana'] || 0);
        totalHisab += parseFloat(item['samun-hisab'] || 0);
      });

      document.getElementById('totalDana').innerText = totalDana.toLocaleString();
      document.getElementById('totalHisab').innerText = totalHisab.toFixed(3);
    }

    function renderTable() {
      const tbody = document.getElementById('samunTableBody');
      tbody.innerHTML = '';

      if (samunList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-2 text-gray-500">هیچ تۆمارێک لەم ماوەیەدا نەدۆزراوەتەوە</td></tr>`;
        return;
      }

      samunList.forEach(item => {
        const id = item['samun-id'] ?? item.id;
        const rawDate = item['samun-date'];
        
        const formattedDate = rawDate ? rawDate.replace(/-/g, '/') : '';
        const dana = item['samun-dana'];
        const hisab = item['samun-hisab'];

        const dateObj = new Date(rawDate + 'T00:00:00');
        const dayNamesMap = { 0: 'یەکشەممە', 1: 'دووشەممە', 2: 'سێشەممە', 3: 'چار شەممە', 4: 'پێنجشەممە', 5: 'جومعه', 6: 'شەممە' };
        const dayName = dayNamesMap[dateObj.getDay()] || '';

        const formattedHisab = hisab !== null && hisab !== undefined ? Number(hisab).toFixed(3) : '0.000';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 border-b border-gray-200 access-row";
        tr.innerHTML = `
          <td class="access-cell border text-center space-x-1 space-x-reverse">
            <button onclick="editRecord('${id}', '${rawDate}', '${dana}')" class="bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">دەستکاری</button>
            <button onclick="deleteRecord('${id}')" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">سڕینەوە</button>
          </td>
          <td class="access-cell border font-bold text-gray-700">${formattedDate}</td>
          <td class="access-cell border text-blue-700 font-bold">${dayName}</td>
          <td class="access-cell border">${dana}</td>
          <td class="access-cell border font-mono text-green-700 font-bold">${formattedHisab}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function generateReport() {
      const startDateVal = document.getElementById('startDate').value;

      if (!startDateVal) return;

      const startDateObj = new Date(startDateVal + 'T00:00:00');
      const monthNum = startDateObj.getMonth() + 1;
      const yearNum = startDateObj.getFullYear();

      // بۆ ڕاپۆرتی مانگانە، با بەروارەکان بە پێچەوانە (لە سەرەتای مانگەوە بۆ کۆتایی) لەناو ڕاپۆرتدا ڕیز ببن
      let { data, error } = await _supabase
        .from(TABLE_NAME)
        .select('*')
        .gte('samun-date', document.getElementById('startDate').value)
        .lte('samun-date', document.getElementById('endDate').value)
        .order('samun-date', { ascending: true });

      if (!error && data) {
        // ئامادەکردنی ناوی مانگ
      }

      const monthText = monthTextMap[monthNum] || `مانگی (${monthNum})`;
      document.getElementById('reportMonthTitle').innerText = `تۆماری صمونی ${monthText} / ${yearNum}`;

      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = '';

      let totalDana = 0;
      let totalHisab = 0;
      const reportList = data || [];

      reportList.forEach((item, index) => {
        const rawDate = item['samun-date'];
        const formattedDate = rawDate ? rawDate.replace(/-/g, '/') : '';
        const dana = item['samun-dana'] || 0;
        const hisab = item['samun-hisab'] || 0;

        totalDana += parseFloat(dana);
        totalHisab += parseFloat(hisab);

        const dateObj = new Date(rawDate + 'T00:00:00');
        const dayNamesMap = { 0: 'یەکشەممە', 1: 'دووشەممە', 2: 'سێشەممە', 3: 'چار شەممە', 4: 'پێنجشەممە', 5: 'جومعه', 6: 'شەممە' };
        const dayName = dayNamesMap[dateObj.getDay()] || '';

        const tr = document.createElement('tr');
        tr.className = "border-b border-black text-center";
        tr.innerHTML = `
          <td class="p-1 border border-black">${index + 1}</td>
          <td class="p-1 border border-black font-bold">${formattedDate}</td>
          <td class="p-1 border border-black">${dayName}</td>
          <td class="p-1 border border-black">${dana}</td>
          <td class="p-1 border border-black font-mono font-bold">${Number(hisab).toFixed(3)}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('reportTotalDana').innerText = totalDana.toLocaleString();
      document.getElementById('reportTotalHisab').innerText = totalHisab.toFixed(3);

      document.getElementById('reportModal').classList.remove('hidden');
    }

    function downloadPDF() {
      const element = document.getElementById('printArea');
      const opt = {
        margin:       5,
        filename:     'Samun-Report.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.add('hidden');
    }

    function openModal() {
      document.getElementById('samunModal').classList.remove('hidden');
      document.getElementById('recordId').value = '';
      document.getElementById('modalTitle').innerText = 'تۆمارکردنی صمون';
      document.getElementById('submitBtn').innerText = 'تۆمارکردن';
      setDefaultDate();
      document.getElementById('samunDana').value = '';
      calculateHisab();
    }

    function closeModal() {
      document.getElementById('samunModal').classList.add('hidden');
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const id = document.getElementById('recordId').value;
      const dateVal = document.getElementById('samunDate').value;
      const danaVal = parseFloat(document.getElementById('samunDana').value);
      const hisabVal = parseFloat(calculateHisab());

      const payload = {
        'samun-date': dateVal,
        'samun-dana': danaVal,
        'samun-hisab': hisabVal
      };

      if (id) {
        const { error } = await _supabase
          .from(TABLE_NAME)
          .update(payload)
          .eq('samun-id', id);

        if (error) {
          alert('هەڵە لە نوێکردنەوە: ' + error.message);
          return;
        }
      } else {
        const { error } = await _supabase
          .from(TABLE_NAME)
          .insert([payload]);

        if (error) {
          alert('هەڵە لە تۆمارکردن: ' + error.message);
          return;
        }
      }

      closeModal();
      
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      fetchSamunData(startDate, endDate);
    }

    function editRecord(id, date, dana) {
      openModal();
      document.getElementById('recordId').value = id;
      document.getElementById('samunDate').value = date;
      document.getElementById('samunDana').value = dana;
      document.getElementById('modalTitle').innerText = 'دەستکاریکردنی تۆمار';
      document.getElementById('submitBtn').innerText = 'نوێکردنەوە';
      updateDayName();
      calculateHisab();
    }

    async function deleteRecord(id) {
      if (confirm('ئایا دڵنیایت لە سڕینەوەی ئەم تۆمارە؟')) {
        const { error } = await _supabase
          .from(TABLE_NAME)
          .delete()
          .eq('samun-id', id);

        if (error) {
          alert('هەڵە لە سڕینەوە: ' + error.message);
          return;
        }

        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        fetchSamunData(startDate, endDate);
      }
    }
  </script>
