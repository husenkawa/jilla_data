<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بەڕێوەبردنی بەکارهێنەران - 0_tbl_useres</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- هێنانی کتێبخانەی Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .dashboard-bg {
      background: linear-gradient(135deg, #d946ef 0%, #e11d48 25%, #f97316 45%, #0284c7 80%, #0f172a 100%);
    }
  </style>
</head>
<body class="dashboard-bg min-h-screen p-4 md:p-8 select-none">

  <!-- Header Section -->
  <div class="max-w-4xl mx-auto flex justify-between items-center mb-6">
    <div class="flex items-center gap-3 bg-white/95 px-5 py-2 rounded-lg shadow-md border border-gray-200">
      <!-- لۆگۆی هوتێل -->
      <img src="logo.png" alt="لۆگۆی هوتێل" class="h-10 w-auto object-contain">
    </div>
    <a href="index.html" class="bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm px-4 py-2 rounded shadow-md border border-gray-600">
      گەڕانەوە
    </a>
  </div>

  <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Form Section -->
    <div class="lg:col-span-1 bg-white/95 backdrop-blur rounded-xl p-5 shadow-2xl border border-gray-200">
      <h2 id="formTitle" class="text-xl font-extrabold text-blue-900 mb-4 border-b pb-2">زیادکردنی یوزەری نوێ</h2>
      
      <form id="userForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="userId" value="">

        <!-- UserName -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">ناوی بەکارهێنەر :</label>
          <input type="text" id="username" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                 placeholder="ناوی یوزەر بنووسە...">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">پاسوۆرد :</label>
          <input type="text" id="password" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                 placeholder="پاسۆرد بنووسە...">
        </div>

        <!-- Type -->
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">جۆری یوزەر</label>
          <select id="userType" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
            <option value="ئاسایی">یوزەری ئاسایی</option>
            <option value="ئادمین">ئادمین</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="flex gap-2 pt-2">
          <button type="submit" id="submitBtn" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded shadow transition">
            خەزنکردن
          </button>
          <button type="button" onclick="resetForm()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold px-3 py-2 rounded transition">
            پاشگەزبوونەوە
          </button>
        </div>
      </form>
    </div>

    <!-- Table Section (Bane ID) -->
    <div class="lg:col-span-2 bg-white/95 backdrop-blur rounded-xl p-5 shadow-2xl border border-gray-200 overflow-hidden">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-xl font-extrabold text-blue-900">لیستی یوزەرەکان</h2>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right border-collapse">
          <thead>
            <tr class="bg-blue-900 text-white text-sm">
              <th class="p-3 border">ناوی بەکارهێنەر</th>
              <th class="p-3 border">پاسوۆردەکان</th>
              <th class="p-3 border">جۆری بەکارهینەر</th>
              <th class="p-3 border text-center"></th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="text-sm font-medium">
            <tr><td colspan="4" class="text-center p-4 text-gray-500">چاوەڕوانبن، داتا لە Supabase دەهێنرێت...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // 1. ڕێکخستنی زانیارییەکانی Supabase
    const SUPABASE_URL = 'https://jrdakonfokyayzlcqnef.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_wZlhj2VEgMjX4xy7M1OeBA_M5xLSNwG';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = '0_tbl_useres';

    let usersList = [];

    // 2. هێنانی داتا لە داتابەیس و نیشاندانی (بێ پیشاندانی ID)
    async function fetchUsers() {
      const { data, error } = await _supabase
        .from(TABLE_NAME)
        .select('*')
        .order('ID', { ascending: true });

      if (error) {
        console.error('هەڵە لە Supabase:', error.message);
        return;
      }

      usersList = data || [];
      renderTable();
    }

    // پیشاندانی داتاکان لە خشتەکەدا بێ ستوونی ID
    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">هیچ یوزەرێک تۆمار نەکراوە</td></tr>`;
        return;
      }

      usersList.forEach(user => {
        const uId = user.ID ?? user.id;
        const uName = user.UserName ?? user.username;
        const uPass = user.Password ?? user.password;
        const uType = user.type;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 border-b border-gray-200";
        tr.innerHTML = `
          <td class="p-3 border">${uName}</td>
          <td class="p-3 border font-mono">${uPass}</td>
          <td class="p-3 border">
            <span class="px-2 py-1 rounded text-xs font-bold ${uType === 'ئادمین' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
              ${uType}
            </span>
          </td>
          <td class="p-3 border text-center space-x-1 space-x-reverse">
            <button onclick="editUser('${uId}', '${uName}', '${uPass}', '${uType}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-2 py-1 rounded">دەستکاری</button>
            <button onclick="deleteUser('${uId}')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-2 py-1 rounded">سڕینەوە</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. خەزنکردن یان نوێکردنەوەی داتا (Insert / Update) و سفرکردنەوەی فۆرم
    async function handleFormSubmit(event) {
      event.preventDefault();
      const id = document.getElementById('userId').value;
      const UserName = document.getElementById('username').value.trim();
      const Password = document.getElementById('password').value.trim();
      const type = document.getElementById('userType').value;

      if (!UserName || !Password) return;

      if (id) {
        // Update
        const { error } = await _supabase
          .from(TABLE_NAME)
          .update({ UserName, Password, type })
          .eq('ID', id);

        if (error) {
          alert('هەڵە ڕوویدا لە دەستکاریکردن: ' + error.message);
          return;
        }
      } else {
        // Insert
        const { error } = await _supabase
          .from(TABLE_NAME)
          .insert([{ UserName, Password, type }]);

        if (error) {
          alert('هەڵە ڕوویدا لە خەزنکردن: ' + error.message);
          return;
        }
      }

      resetForm();
      await fetchUsers();
    }

    // 4. پڕکردنەوەی فۆرم بۆ دەستکاری
    function editUser(id, username, password, type) {
      document.getElementById('userId').value = id;
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      document.getElementById('userType').value = type;

      document.getElementById('formTitle').innerText = 'دەستکاریکردنی یوزەر: ' + username;
      document.getElementById('submitBtn').innerText = 'نوێکردنەوە';
      document.getElementById('submitBtn').className = 'flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded shadow transition';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 5. سڕینەوەی داتا (Delete)
    async function deleteUser(id) {
      if (confirm('ئایا دڵنیایت لە سڕینەوەی ئەم یوزەرە؟')) {
        const { error } = await _supabase
          .from(TABLE_NAME)
          .delete()
          .eq('ID', id);

        if (error) {
          alert('هەڵە ڕوویدا لە سڕینەوە: ' + error.message);
          return;
        }

        await fetchUsers();
        resetForm();
      }
    }

    // پاککردنەوە و سفرکردنەوەی خانەکانی فۆرم
    function resetForm() {
      document.getElementById('userForm').reset();
      document.getElementById('userId').value = '';
      document.getElementById('formTitle').innerText = 'زیادکردنی یوزەری نوێ';
      document.getElementById('submitBtn').innerText = 'خەزنکردن';
      document.getElementById('submitBtn').className = 'flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded shadow transition';
    }

    // هێنانی سەرەتایی داتاکان
    fetchUsers();
  </script>
</body>
</html>
